# Render (render.com) blueprint for the online game server: server/README.md has the steps.
services:
  - type: web
    name: fate-dark-night-city # the web address: https://fate-dark-night-city.onrender.com (if the name is free on Render)
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
