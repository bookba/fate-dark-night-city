<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fate Battle Royale</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="daytrack" class="hud"></div>
      <div id="banner"></div>
      <aside id="left">
        <div id="status" class="hud"></div>
        <div id="secret" class="hud"></div>
        <div id="items" class="hud"></div>
        <div id="charcard"></div>
      </aside>
      <div id="stage"></div>
      <div id="choice" class="hud"></div>
      <aside id="players" class="hud"></aside>
      <button id="logbtn" class="hud">☰ บันทึก</button>
      <div id="logdrawer" class="hud" hidden><h4>บันทึกเหตุการณ์</h4><div class="lines"></div></div>
    </div>
    <div id="battle" hidden></div>
    <div id="modal" hidden><div class="sheet"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
