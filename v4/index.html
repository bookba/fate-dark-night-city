<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fate Battle Royale v4</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&display=swap" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud"></header>
      <main id="stage">
        <div id="eventbar"></div>
        <div id="board"></div>
        <section id="panel" aria-live="polite"></section>
      </main>
      <section id="dock"></section>
      <aside id="side">
        <div id="standings"></div>
        <details id="logbox" open>
          <summary>บันทึกสงคราม</summary>
          <div id="log"></div>
        </details>
      </aside>
    </div>
    <div id="sheet" hidden></div>
    <div id="modal" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
